<style>
  :root{--paper:#0e0e1a;--paper-deep:#0a0a13;--ink:#e9e7f5;--ink-soft:#9a95b8;--accent:#5aa0e8;--accent-2:#a88ef0;--line:#26263e;

  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65;}
  h1{font-family:var(--display);font-weight:600;letter-spacing:-.02em;}
  a{color:var(--accent);text-decoration:none;}
  .wrap{max-width:880px;margin:0 auto;padding:0 28px;}
  nav{position:sticky;top:0;background:rgba(14,14,26,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:50;}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;}
  .logo{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--ink);}
  .logo em{color:var(--accent);font-style:normal;}
  .back{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .back:hover{color:var(--accent);}
  header{padding:70px 0 34px;}
  .kicker{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.9rem;}
  h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;margin-bottom:1rem;}
  .lead{color:var(--ink-soft);font-size:1.02rem;max-width:640px;}
  .media{margin:40px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#000;}
  .media video,.media img{width:100%;display:block;}
  .ph-placeholder{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#9a7ce8,#6647b8);color:#fff;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;}
  .links{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.6rem 0 80px;}
  .bhn{display:inline-flex;align-items:center;gap:.45rem;padding:.75rem 1.5rem;background:var(--accent);border:1px solid var(--accent);border-radius:999px;font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#0e0e1a;box-shadow:0 6px 18px rgba(90,160,232,.35);transition:transform .2s,box-shadow .2s,background .2s;}
  .bhn:hover{background:var(--accent-2);border-color:var(--accent-2);transform:translateY(-2px);box-shadow:0 10px 24px rgba(168,142,240,.45);}
  .bhn.pending{background:transparent;box-shadow:none;}
  .bhn.pending{border-color:var(--line);color:#5f5b80;pointer-events:none;}
</style>
